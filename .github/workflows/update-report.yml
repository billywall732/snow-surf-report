# Fetches fresh conditions every morning, saves them to data/report.json,
# and publishes the site to GitHub Pages.
#
# Why this workflow also deploys the site: commits pushed by a workflow (using the
# built-in GITHUB_TOKEN) do NOT trigger GitHub's normal "deploy from branch" Pages
# build. So instead of relying on that, this workflow publishes the site itself.
# In repo Settings -> Pages, set Source to "GitHub Actions".

name: Update report

on:
  schedule:
    # GitHub cron uses UTC and ignores daylight saving time.
    # 12:00 UTC = 5:00 AM Pacific in summer (PDT), 4:00 AM in winter (PST).
    # Scheduled runs often start 10-30 minutes late; the early time absorbs that.
    - cron: '0 12 * * *'
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab
  push:
    branches: [main] # redeploy when you push code changes (no data fetch)

permissions:
  contents: write # commit data/report.json
  pages: write # publish to GitHub Pages
  id-token: write # required by actions/deploy-pages

# Never run two updates at once; a second run waits for the first.
concurrency:
  group: update-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch conditions
        if: github.event_name != 'push'
        run: node scripts/fetch-report.mjs

      - name: Commit report if it changed
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/report.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update report $(date -u +%Y-%m-%d)"
            git push
          fi

      # Email alerts to people who signed in with Google and turned them on.
      # Skipped (without failing) until the three secrets are added; see the README.
      # A problem here never stops the site from publishing.
      - name: Email alerts
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "Email alerts aren't set up yet (no secrets), skipping."
            exit 0
          fi
          npm install --no-save --no-audit --no-fund --prefix scripts/email firebase-admin@12.7.0 nodemailer@6.9.16
          node scripts/email/send-emails.mjs

      # Copy only the files the website needs into _site/ and publish that folder.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest icon.svg css js data _site/

      # Cache-busting: GitHub Pages lets browsers keep files for 10 minutes, so right
      # after a publish a phone could mix the old CSS with the new JavaScript (broken
      # layout). Adding "?v=<commit>" to every CSS/JS address in the published copy
      # makes each version's files brand-new addresses. (Your own files don't change.)
      - name: Stamp file versions
        run: |
          V="${GITHUB_SHA::8}"
          # index.html: the stylesheet, the app script and the modulepreload links
          sed -i -E "s#(href|src)=\"(css/[a-z0-9-]+\.css|js/[a-z0-9-]+\.js)\"#\1=\"\2?v=$V\"#g" _site/index.html
          # every import between the JavaScript files: from './ui.js' -> from './ui.js?v=...'
          sed -i -E "s#(from '\./[a-z0-9-]+\.js)'#\1?v=$V'#g" _site/js/*.js
          grep -c "?v=$V" _site/index.html _site/js/*.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
