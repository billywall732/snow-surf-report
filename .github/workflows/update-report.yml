# Fetches fresh conditions every hour and publishes the site to GitHub Pages.
#
#   - Every hour: fetch, then publish (the site always has the latest report).
#   - Once a day: also commit data/report.json to the repo, as a daily snapshot.
#     (Committing every hour would add ~500 KB x 24 to the repo each day.)
#   - Every hour: email confirmation links to newly chosen alert addresses.
#   - Once a day, in the morning (Pacific): email and phone alerts.
#   - On a code push: fetch too, so a code change never publishes old data.
#
# Why this workflow also deploys the site: commits pushed by a workflow (using the
# built-in GITHUB_TOKEN) do NOT trigger GitHub's normal "deploy from branch" Pages
# build. So instead of relying on that, this workflow publishes the site itself.
# In repo Settings -> Pages, set Source to "GitHub Actions".

name: Update report

on:
  schedule:
    # Every hour at 17 minutes past. GitHub is busiest on the hour, and runs set
    # for :00 can start very late; an off-minute starts more reliably.
    - cron: '17 * * * *'
    # Extra runs aimed at just after 5 AM Pacific, so the morning alerts go out early.
    # GitHub skips many scheduled runs when it's busy (in Nov 2026 this workflow ran
    # only 3-5 times a day, not 24), so there are several shots at it: 12:05 and 12:35
    # UTC are 5:05 / 5:35 AM in summer (PDT), 13:05 and 13:35 UTC the same in winter
    # (PST). Whichever lands first after 5 AM sends; the rest find nothing to do.
    - cron: '5 12 * * *'
    - cron: '35 12 * * *'
    - cron: '5 13 * * *'
    - cron: '35 13 * * *'
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab
    inputs:
      sample:
        description: 'Only send example snow + surf emails (and a weekly-note example) - no real alerts'
        type: boolean
        default: false
      sample_to:
        description: 'Send the examples to this address instead of the GMAIL_USER inbox (optional)'
        type: string
        default: ''
  push:
    branches: [main] # redeploy when you push code changes

permissions:
  contents: write # commit the daily snapshot of data/report.json
  pages: write # publish to GitHub Pages
  id-token: write # required by actions/deploy-pages

# Never run two updates at once; a second run waits for the first.
concurrency:
  group: update-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # On a code push, a failed fetch still publishes (with the last saved report).
      - name: Fetch conditions
        continue-on-error: ${{ github.event_name == 'push' }}
        run: node scripts/fetch-report.mjs

      # The daily snapshot: the first run from 12:00 UTC (4-5 AM Pacific) that finds
      # no report committed yet today. Every other hour publishes without committing.
      # A problem here never stops the site from publishing.
      - name: Commit daily snapshot
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          today=$(date -u +%F)
          # The last snapshot's date in UTC (whatever time zone that commit was made in)
          last=$(TZ=UTC git log -1 --date=format-local:%F --format=%cd -- data/report.json)
          if [ "$(date -u +%H)" -lt 12 ] || [ "$last" = "$today" ]; then
            echo "Not snapshot time (last snapshot: $last). Publishing without a commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/report.json data/version.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update report $today"
            # If code was pushed meanwhile, put the snapshot on top of it
            git push || (git pull --rebase -X theirs && git push)
          fi

      # Email and phone alerts for people who signed in with Google.
      #   - Every run: email a confirmation link to anyone who chose a new address.
      #   - Mornings only (5-11 AM Pacific): the alerts themselves. The first run after
      #     5 AM sends (the extra 5:05 / 5:35 AM schedules above aim for that), and the
      #     script never sends anyone two in a day, so later morning runs skip them.
      #     The window stays open until 11 AM on purpose: when GitHub skips the early
      #     runs, a late alert beats no alert. "Run workflow" by hand always counts as
      #     morning.
      # Skipped (without failing) until SUPABASE_SECRET_KEY is added; see the
      # README. A problem here never stops the site from publishing.
      - name: Email and phone alerts
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SAMPLE: ${{ inputs.sample && '1' || '' }}
          SAMPLE_TO: ${{ inputs.sample_to }}
          SITE_URL: ${{ vars.SITE_URL }} # set this repo variable when the site moves to its own domain
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ] || [ -z "$SUPABASE_URL" ]; then
            echo "Alerts aren't set up yet (no SUPABASE_SECRET_KEY secret or SUPABASE_URL variable), skipping."
            exit 0
          fi
          hour=$(TZ=America/Los_Angeles date +%-H)
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || { [ "$hour" -ge 5 ] && [ "$hour" -le 11 ]; }; then
            export MORNING=1
          fi
          npm install --no-save --no-audit --no-fund --prefix scripts/email @supabase/supabase-js@2.118.0 nodemailer@6.9.16 web-push@3.6.7
          node scripts/email/send-emails.mjs

      # Copy only the files the website needs into _site/ and publish that folder.
      - name: Assemble site
        run: |
          mkdir _site
          # icon-email.png: the logo in the alert emails (they load it from the site)
          cp -r index.html manifest.webmanifest icon.svg icon-email.png css js data _site/

      # Cache-busting: GitHub Pages lets browsers keep files for 10 minutes, so right
      # after a publish a phone could mix the old CSS with the new JavaScript (broken
      # layout). Adding "?v=<commit>" to every CSS/JS address in the published copy
      # makes each version's files brand-new addresses. (Your own files don't change.)
      - name: Stamp file versions
        run: |
          V="${GITHUB_SHA::8}"
          # index.html: the stylesheet, the app script and the modulepreload links
          sed -i -E "s#(href|src)=\"(css/[a-z0-9-]+\.css|js/[a-z0-9-]+\.js)\"#\1=\"\2?v=$V\"#g" _site/index.html
          # every import between the JavaScript files: from './ui.js' -> from './ui.js?v=...'
          sed -i -E "s#(from '\./[a-z0-9-]+\.js)'#\1?v=$V'#g" _site/js/*.js
          grep -c "?v=$V" _site/index.html _site/js/*.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
